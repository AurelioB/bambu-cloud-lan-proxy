name: bambu-cloud-lan-proxy

services:
  bootstrap:
    build:
      context: .
      dockerfile: docker/bootstrap.Dockerfile
    environment:
      PROXY_ACCESS_CODE: ${PROXY_ACCESS_CODE:?Run ./scripts/init.sh first}
      PROXY_BIND_IP: ${PROXY_BIND_IP:-127.0.0.2}
      PROXY_RUNTIME_UID: ${PUID:-1000}
      PROXY_RUNTIME_GID: ${PGID:-1000}
      PROXY_PRINTER_REGISTRY: /registry/printers.json
    volumes:
      - ./data/proxy:/data
      - ./data/staging:/staging
      - ./data/remote-cache:/remote-cache
      - ./data/camera:/camera-state
      - ./data/local-status:/local-status
      - ./data/gateway:/registry:ro
    restart: "no"

  mqtt:
    build:
      context: .
      dockerfile: docker/mqtt.Dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:18883:8883"
    user: "1883:1883"
    volumes:
      - ./data/proxy/runtime:/mosquitto/secrets:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  ftps:
    profiles: ["legacy-single-endpoint"]
    image: bambu-cloud-lan-proxy:${PROXY_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile.proxy
      args:
        PROXY_VERSION: ${PROXY_VERSION:-dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${PROXY_BIND_IP:-127.0.0.2}:990:9990"
      - "${PROXY_BIND_IP:-127.0.0.2}:50000-50009:50000-50009"
    environment:
      FTPS_ACCESS_CODE: ${PROXY_ACCESS_CODE:?Run ./scripts/init.sh first}
      FTPS_ADVERTISE_IP: ${PROXY_BIND_IP:-127.0.0.2}
      FTPS_PORT: "9990"
      FTPS_PASSIVE_MIN: "50000"
      FTPS_PASSIVE_MAX: "50009"
      FTPS_ROOT: /staging
      FTPS_MAX_UPLOAD_MB: ${PROXY_FTPS_MAX_UPLOAD_MB:-1024}
      FTPS_MAX_TOTAL_MB: ${PROXY_FTPS_MAX_TOTAL_MB:-10240}
      LOG_LEVEL: ${PROXY_LOG_LEVEL:-INFO}
    command: ["ftps"]
    volumes:
      - ./data/proxy/runtime/certs:/secrets/certs:ro
      - ./data/staging:/staging
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - timeout 4 openssl s_client -connect 127.0.0.1:9990 </dev/null >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  camera:
    profiles: ["legacy-single-endpoint"]
    image: bambu-cloud-lan-proxy:${PROXY_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile.proxy
      args:
        PROXY_VERSION: ${PROXY_VERSION:-dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROXY_ACCESS_CODE: ${PROXY_ACCESS_CODE:?Run ./scripts/init.sh first}
      CAMERA_PRINTER_SERIAL: ${CAMERA_PRINTER_SERIAL:-}
      CAMERA_UPSTREAM_IP: ${CAMERA_UPSTREAM_IP:-}
      CAMERA_UPSTREAM_PORT: ${CAMERA_UPSTREAM_PORT:-322}
      CAMERA_UPSTREAM_TLS_FINGERPRINT: ${CAMERA_UPSTREAM_TLS_FINGERPRINT:-}
      CAMERA_LISTEN_IP: host.docker.internal
      CAMERA_LISTEN_PORT: "8322"
    volumes:
      - ./data/proxy/runtime/certs:/secrets/certs:ro
      - ./data/gateway:/data:ro
      - ./data/camera:/state
    command: ["camera"]
    user: "1883:1883"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - timeout 4 openssl s_client -connect host.docker.internal:8322 </dev/null >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  native-files:
    profiles: ["legacy-single-endpoint"]
    image: bambu-cloud-lan-proxy:${PROXY_VERSION:-dev}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${PROXY_BIND_IP:-127.0.0.2}:6000:6000"
    environment:
      FTPS_ACCESS_CODE: ${PROXY_ACCESS_CODE:?Run ./scripts/init.sh first}
      FTPS_ROOT: /staging
      FTPS_CERT_FILE: /secrets/certs/server.crt
      FTPS_KEY_FILE: /secrets/certs/server.key
      FTPS_MAX_UPLOAD_MB: ${PROXY_FTPS_MAX_UPLOAD_MB:-1024}
      FTPS_MAX_TOTAL_MB: ${PROXY_FTPS_MAX_TOTAL_MB:-10240}
      FTPS_REMOTE_API_URL: http://gateway:4844/internal/cloud-lan-proxy/storage
      FTPS_REMOTE_SERIAL: ${PROXY_STORAGE_PRINTER_SERIAL:-}
      FTPS_REMOTE_CACHE_DIR: /remote-cache
      NATIVE_FILES_PORT: "6000"
      LOG_LEVEL: ${PROXY_LOG_LEVEL:-INFO}
    volumes:
      - ./data/proxy/runtime/certs:/secrets/certs:ro
      - ./data/staging:/staging
      - ./data/remote-cache:/remote-cache
    command: ["native-files"]
    user: "1883:1883"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - timeout 4 openssl s_client -connect 127.0.0.1:6000 </dev/null >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  discovery:
    profiles: ["legacy-single-endpoint"]
    image: bambu-cloud-lan-proxy:${PROXY_VERSION:-dev}
    depends_on:
      native-files:
        condition: service_healthy
    network_mode: host
    environment:
      DISCOVERY_PRINTER_IP: ${PROXY_BIND_IP:-127.0.0.2}
      DISCOVERY_PRINTER_SERIAL: ${PROXY_STORAGE_PRINTER_SERIAL:-}
      DISCOVERY_PRINTER_MODEL: ${PROXY_DISCOVERY_MODEL:-Bambu Lab Printer}
      DISCOVERY_PRINTER_NAME: ${PROXY_DISCOVERY_NAME:-Bambu Cloud LAN Proxy}
      DISCOVERY_TARGET: ${PROXY_DISCOVERY_TARGET:-127.0.0.1}
      LOG_LEVEL: ${PROXY_LOG_LEVEL:-INFO}
    command: ["discovery"]
    user: "1883:1883"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  camera-ingress:
    profiles: ["legacy-single-endpoint"]
    image: bambu-cloud-lan-proxy:${PROXY_VERSION:-dev}
    depends_on:
      camera:
        condition: service_healthy
    ports:
      - "${PROXY_BIND_IP:-127.0.0.2}:322:8322"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TCP_RELAY_UPSTREAM_HOST: host.docker.internal
      TCP_RELAY_UPSTREAM_PORT: "8322"
      TCP_RELAY_LISTEN_PORT: "8322"
    command: ["tcp-relay"]
    user: "1883:1883"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - timeout 3 bash -c '</dev/tcp/127.0.0.1/8322'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  local-status:
    profiles: ["legacy-single-endpoint"]
    image: bambu-cloud-lan-proxy:${PROXY_VERSION:-dev}
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      LOCAL_STATUS_PRINTER_SERIAL: ${PROXY_STORAGE_PRINTER_SERIAL:-}
      LOCAL_STATUS_UPSTREAM_IP: ${CAMERA_UPSTREAM_IP:-}
      LOCAL_STATUS_BROKER_HOST: mqtt
      LOCAL_STATUS_STATE_DIR: /state
      LOG_LEVEL: ${PROXY_LOG_LEVEL:-INFO}
    volumes:
      - ./data/gateway:/data:ro
      - ./data/local-status:/state
    command: ["local-status"]
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  gateway:
    image: bambu-cloud-lan-proxy:${PROXY_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile.proxy
      args:
        PROXY_VERSION: ${PROXY_VERSION:-dev}
    depends_on:
      mqtt:
        condition: service_healthy
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-4844}:4844"
    environment:
      TZ: ${TZ:-UTC}
      BAMBU_CLOUD_ENABLED: "true"
      BAMBU_CLOUD_REGION: ${BAMBU_CLOUD_REGION:-US}
      CLOUD_LAN_PROXY_ENABLED: "true"
      CLOUD_LAN_PROXY_BROKER_HOST: mqtt
      CLOUD_LAN_PROXY_BROKER_PORT: "1883"
      CLOUD_LAN_PROXY_MODE: ${PROXY_MODE:-read_only}
      CLOUD_LAN_PROXY_ALLOW_CANCEL: ${PROXY_ALLOW_CANCEL:-false}
      CLOUD_LAN_PROXY_CLOUD_PRINT_ENABLED: ${PROXY_CLOUD_PRINT_ENABLED:-false}
      CLOUD_LAN_PROXY_REMOTE_REPRINT_ENABLED: ${PROXY_STORAGE_ALLOW_REPRINT:-false}
      CLOUD_LAN_PROXY_CLOUD_PRINT_WAIT_SECONDS: ${PROXY_CLOUD_PRINT_WAIT_SECONDS:-900}
      CLOUD_LAN_PROXY_CLOUD_PRINT_PROGRESS_TIMEOUT: ${PROXY_CLOUD_PRINT_PROGRESS_TIMEOUT:-900}
      CLOUD_LAN_PROXY_CLOUD_PRINT_MAX_MB: ${PROXY_FTPS_MAX_UPLOAD_MB:-1024}
      CLOUD_LAN_PROXY_STAGING_DIR: /staging
      CLOUD_LAN_PROXY_ADVERTISE_CONTROLS: ${PROXY_ADVERTISE_CONTROLS:-auto}
      CLOUD_LAN_PROXY_PRINTERS: ${PROXY_PRINTERS:-}
      CLOUD_LAN_PROXY_ACCESS_CODE: ${PROXY_ACCESS_CODE:?Run ./scripts/init.sh first}
      CLOUD_LAN_PROXY_REMOTE_CACHE_DIR: /remote-cache
      CLOUD_LAN_PROXY_REMOTE_MAX_MB: ${PROXY_STORAGE_MAX_DOWNLOAD_MB:-4096}
      CLOUD_LAN_PROXY_REMOTE_SUBFILE_MAX_MB: ${PROXY_STORAGE_SUBFILE_MAX_MB:-256}
      CLOUD_LAN_PROXY_STORAGE_ALLOW_UPLOAD: ${PROXY_STORAGE_ALLOW_UPLOAD:-false}
      CLOUD_LAN_PROXY_STORAGE_ALLOW_DELETE: ${PROXY_STORAGE_ALLOW_DELETE:-false}
      CLOUD_LAN_PROXY_LOCAL_STATUS_STATE_DIR: /local-status
    volumes:
      - ./data/gateway:/data
      - ./data/proxy/export:/proxy-ca:ro
      - ./data/staging:/staging:ro
      - ./data/remote-cache:/remote-cache
      - ./data/local-status:/local-status:ro
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - curl -fsS http://127.0.0.1:4844/api/health >/dev/null && curl -fsS http://127.0.0.1:4844/api/cloud/auth/status >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  endpoint-manager:
    image: bambu-cloud-lan-proxy:${PROXY_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile.proxy
      args:
        PROXY_VERSION: ${PROXY_VERSION:-dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      endpoint-addresses:
        condition: service_completed_successfully
    network_mode: host
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PROXY_ACCESS_CODE: ${PROXY_ACCESS_CODE:?Run ./scripts/init.sh first}
      ENDPOINT_REGISTRY: /data/printers.json
      ENDPOINT_BROKER_HOST: 127.0.0.1
      ENDPOINT_BROKER_PORT: "1883"
      ENDPOINT_TLS_BROKER_PORT: "18883"
      ENDPOINT_STORAGE_API_URL: http://127.0.0.1:${GATEWAY_PORT:-4844}/internal/cloud-lan-proxy/storage
      ENDPOINT_STAGING_ROOT: /staging
      ENDPOINT_REMOTE_CACHE_DIR: /remote-cache
      ENDPOINT_CAMERA_STATE_DIR: /camera-state
      ENDPOINT_LOCAL_STATUS_DIR: /local-status
      ENDPOINT_LOCAL_STATUS: ${PROXY_LOCAL_STATUS_ENABLED:-true}
      DISCOVERY_TARGET: ${PROXY_DISCOVERY_TARGET:-255.255.255.255}
      FTPS_MAX_UPLOAD_MB: ${PROXY_FTPS_MAX_UPLOAD_MB:-1024}
      FTPS_MAX_TOTAL_MB: ${PROXY_FTPS_MAX_TOTAL_MB:-10240}
      LOG_LEVEL: ${PROXY_LOG_LEVEL:-INFO}
    command: ["endpoint-manager"]
    volumes:
      - ./data/gateway:/data:ro
      - ./data/proxy/runtime/certs:/secrets/certs:ro
      - ./data/staging:/staging
      - ./data/remote-cache:/remote-cache
      - ./data/camera:/camera-state
      - ./data/local-status:/local-status
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  endpoint-addresses:
    image: bambu-cloud-lan-proxy:${PROXY_VERSION:-dev}
    build:
      context: .
      dockerfile: Dockerfile.proxy
      args:
        PROXY_VERSION: ${PROXY_VERSION:-dev}
    network_mode: host
    environment:
      ENDPOINT_REGISTRY: /data/printers.json
      ENDPOINT_INTERFACE: ${PROXY_ENDPOINT_INTERFACE:-}
      LOG_LEVEL: ${PROXY_LOG_LEVEL:-INFO}
    command: ["endpoint-addresses"]
    volumes:
      - ./data/gateway:/data:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
