name: bambu-cloud-lan-proxy

services:
  bootstrap:
    build:
      context: .
      dockerfile: docker/bootstrap.Dockerfile
    environment:
      PROXY_ACCESS_CODE: ${PROXY_ACCESS_CODE:?Run ./scripts/init.sh first}
      PROXY_BIND_IP: ${PROXY_BIND_IP:-127.0.0.2}
    volumes:
      - ./data/proxy:/data
      - ./data/staging:/staging
      - ./data/remote-cache:/remote-cache
      - ./data/camera:/camera-state
      - ./data/local-status:/local-status
    restart: "no"

  mqtt:
    build:
      context: .
      dockerfile: docker/mqtt.Dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${PROXY_BIND_IP:-127.0.0.2}:8883:8883"
    user: "1883:1883"
    volumes:
      - ./data/proxy/runtime:/mosquitto/secrets:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  ftps:
    build:
      context: .
      dockerfile: Dockerfile.ftps
      args:
        PROXY_VERSION: ${PROXY_VERSION:-dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${PROXY_BIND_IP:-127.0.0.2}:990:9990"
      - "${PROXY_BIND_IP:-127.0.0.2}:50000-50009:50000-50009"
    environment:
      FTPS_ACCESS_CODE: ${PROXY_ACCESS_CODE:?Run ./scripts/init.sh first}
      FTPS_ADVERTISE_IP: ${PROXY_BIND_IP:-127.0.0.2}
      FTPS_PORT: "9990"
      FTPS_PASSIVE_MIN: "50000"
      FTPS_PASSIVE_MAX: "50009"
      FTPS_ROOT: /staging
      FTPS_MAX_UPLOAD_MB: ${PROXY_FTPS_MAX_UPLOAD_MB:-1024}
      FTPS_MAX_TOTAL_MB: ${PROXY_FTPS_MAX_TOTAL_MB:-10240}
      FTPS_REMOTE_API_URL: http://gateway:4844/internal/cloud-lan-proxy/storage
      FTPS_REMOTE_SERIAL: ${PROXY_STORAGE_PRINTER_SERIAL:-}
      FTPS_REMOTE_SERIALS: ${PROXY_PRINTERS:-}
      FTPS_REMOTE_CACHE_DIR: /remote-cache
      FTPS_REMOTE_CATALOG_TTL: ${PROXY_STORAGE_CATALOG_TTL:-30}
      FTPS_REMOTE_ALLOW_UPLOAD: ${PROXY_STORAGE_ALLOW_UPLOAD:-false}
      FTPS_REMOTE_ALLOW_DELETE: ${PROXY_STORAGE_ALLOW_DELETE:-false}
      LOG_LEVEL: ${PROXY_LOG_LEVEL:-INFO}
    volumes:
      - ./data/proxy/runtime/certs:/secrets/certs:ro
      - ./data/staging:/staging
      - ./data/remote-cache:/remote-cache
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket,ssl; c=ssl._create_unverified_context(); s=c.wrap_socket(socket.socket(),server_hostname='localhost'); s.settimeout(3); s.connect(('127.0.0.1',9990)); assert s.recv(4).startswith(b'220 '); s.close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  camera:
    build:
      context: .
      dockerfile: Dockerfile.camera
      args:
        PROXY_VERSION: ${PROXY_VERSION:-dev}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROXY_ACCESS_CODE: ${PROXY_ACCESS_CODE:?Run ./scripts/init.sh first}
      CAMERA_PRINTER_SERIAL: ${CAMERA_PRINTER_SERIAL:-}
      CAMERA_UPSTREAM_IP: ${CAMERA_UPSTREAM_IP:-}
      CAMERA_UPSTREAM_PORT: ${CAMERA_UPSTREAM_PORT:-322}
      CAMERA_UPSTREAM_TLS_FINGERPRINT: ${CAMERA_UPSTREAM_TLS_FINGERPRINT:-}
      CAMERA_LISTEN_IP: host.docker.internal
      CAMERA_LISTEN_PORT: "8322"
    volumes:
      - ./data/proxy/runtime/certs:/secrets/certs:ro
      - ./data/gateway/printers.json:/gateway/printers.json:ro
      - ./data/camera:/state
    user: "1883:1883"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket,ssl; h=socket.gethostbyname('host.docker.internal'); c=ssl._create_unverified_context(); s=c.wrap_socket(socket.socket(),server_hostname=h); s.settimeout(3); s.connect((h,8322)); s.close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  native-files:
    image: bambu-cloud-lan-proxy-ftps
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${PROXY_BIND_IP:-127.0.0.2}:6000:6000"
    environment:
      FTPS_ACCESS_CODE: ${PROXY_ACCESS_CODE:?Run ./scripts/init.sh first}
      FTPS_ROOT: /staging
      FTPS_CERT_FILE: /secrets/certs/server.crt
      FTPS_KEY_FILE: /secrets/certs/server.key
      FTPS_MAX_UPLOAD_MB: ${PROXY_FTPS_MAX_UPLOAD_MB:-1024}
      FTPS_MAX_TOTAL_MB: ${PROXY_FTPS_MAX_TOTAL_MB:-10240}
      FTPS_REMOTE_API_URL: http://gateway:4844/internal/cloud-lan-proxy/storage
      FTPS_REMOTE_SERIAL: ${PROXY_STORAGE_PRINTER_SERIAL:-}
      FTPS_REMOTE_SERIALS: ${PROXY_PRINTERS:-}
      FTPS_REMOTE_CACHE_DIR: /remote-cache
      FTPS_REMOTE_CATALOG_TTL: ${PROXY_STORAGE_CATALOG_TTL:-30}
      NATIVE_FILES_PORT: "6000"
      LOG_LEVEL: ${PROXY_LOG_LEVEL:-INFO}
    volumes:
      - ./data/proxy/runtime/certs:/secrets/certs:ro
      - ./data/staging:/staging
      - ./data/remote-cache:/remote-cache
    entrypoint: ["python", "-m", "bambu_cloud_lan_proxy.native_files"]
    user: "1883:1883"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket,ssl; c=ssl._create_unverified_context(); s=c.wrap_socket(socket.socket(),server_hostname='localhost'); s.settimeout(3); s.connect(('127.0.0.1',6000)); s.close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  discovery:
    image: bambu-cloud-lan-proxy-ftps
    depends_on:
      native-files:
        condition: service_healthy
    network_mode: host
    environment:
      DISCOVERY_PRINTER_IP: ${PROXY_BIND_IP:-127.0.0.2}
      DISCOVERY_PRINTER_SERIAL: ${PROXY_STORAGE_PRINTER_SERIAL:-}
      DISCOVERY_PRINTER_MODEL: ${PROXY_DISCOVERY_MODEL:-H2C}
      DISCOVERY_PRINTER_NAME: ${PROXY_DISCOVERY_NAME:-Bambu Cloud LAN Proxy}
      DISCOVERY_TARGET: ${PROXY_DISCOVERY_TARGET:-127.0.0.1}
      LOG_LEVEL: ${PROXY_LOG_LEVEL:-INFO}
    entrypoint: ["python", "-m", "bambu_cloud_lan_proxy.discovery"]
    user: "1883:1883"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  camera-ingress:
    image: bambu-cloud-lan-proxy-camera
    depends_on:
      camera:
        condition: service_healthy
    ports:
      - "${PROXY_BIND_IP:-127.0.0.2}:322:8322"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TCP_RELAY_UPSTREAM_HOST: host.docker.internal
      TCP_RELAY_UPSTREAM_PORT: "8322"
      TCP_RELAY_LISTEN_PORT: "8322"
    entrypoint: ["python", "-m", "bambu_cloud_lan_proxy.tcp_relay"]
    user: "1883:1883"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; s=socket.create_connection(('127.0.0.1',8322),3); s.close()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  local-status:
    image: bambu-cloud-lan-proxy-gateway
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      LOCAL_STATUS_PRINTER_SERIAL: ${PROXY_STORAGE_PRINTER_SERIAL:-}
      LOCAL_STATUS_UPSTREAM_IP: ${CAMERA_UPSTREAM_IP:-}
      LOCAL_STATUS_BROKER_HOST: mqtt
      LOCAL_STATUS_STATE_DIR: /state
      LOG_LEVEL: ${PROXY_LOG_LEVEL:-INFO}
    volumes:
      - ./data/gateway/printers.json:/gateway/printers.json:ro
      - ./data/local-status:/state
    entrypoint: ["python", "-m", "bambu_cloud_lan_proxy.local_status"]
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
      args:
        PROXY_VERSION: ${PROXY_VERSION:-dev}
    depends_on:
      mqtt:
        condition: service_healthy
      ftps:
        condition: service_healthy
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-4844}:4844"
    environment:
      TZ: ${TZ:-UTC}
      BAMBU_CLOUD_ENABLED: "true"
      BAMBU_CLOUD_REGION: ${BAMBU_CLOUD_REGION:-US}
      CLOUD_LAN_PROXY_ENABLED: "true"
      CLOUD_LAN_PROXY_BROKER_HOST: mqtt
      CLOUD_LAN_PROXY_BROKER_PORT: "1883"
      CLOUD_LAN_PROXY_MODE: ${PROXY_MODE:-read_only}
      CLOUD_LAN_PROXY_ALLOW_CANCEL: ${PROXY_ALLOW_CANCEL:-false}
      CLOUD_LAN_PROXY_CLOUD_PRINT_ENABLED: ${PROXY_CLOUD_PRINT_ENABLED:-false}
      CLOUD_LAN_PROXY_REMOTE_REPRINT_ENABLED: ${PROXY_STORAGE_ALLOW_REPRINT:-false}
      CLOUD_LAN_PROXY_CLOUD_PRINT_WAIT_SECONDS: ${PROXY_CLOUD_PRINT_WAIT_SECONDS:-900}
      CLOUD_LAN_PROXY_CLOUD_PRINT_PROGRESS_TIMEOUT: ${PROXY_CLOUD_PRINT_PROGRESS_TIMEOUT:-900}
      CLOUD_LAN_PROXY_CLOUD_PRINT_MAX_MB: ${PROXY_FTPS_MAX_UPLOAD_MB:-1024}
      CLOUD_LAN_PROXY_STAGING_DIR: /staging
      CLOUD_LAN_PROXY_ADVERTISE_CONTROLS: ${PROXY_ADVERTISE_CONTROLS:-auto}
      CLOUD_LAN_PROXY_PRINTERS: ${PROXY_PRINTERS:-}
      CLOUD_LAN_PROXY_ACCESS_CODE: ${PROXY_ACCESS_CODE:?Run ./scripts/init.sh first}
      CLOUD_LAN_PROXY_REMOTE_CACHE_DIR: /remote-cache
      CLOUD_LAN_PROXY_REMOTE_MAX_MB: ${PROXY_STORAGE_MAX_DOWNLOAD_MB:-4096}
      CLOUD_LAN_PROXY_REMOTE_SUBFILE_MAX_MB: ${PROXY_STORAGE_SUBFILE_MAX_MB:-256}
      CLOUD_LAN_PROXY_STORAGE_ALLOW_UPLOAD: ${PROXY_STORAGE_ALLOW_UPLOAD:-false}
      CLOUD_LAN_PROXY_STORAGE_ALLOW_DELETE: ${PROXY_STORAGE_ALLOW_DELETE:-false}
      CLOUD_LAN_PROXY_LOCAL_STATUS_STATE_DIR: /local-status
    volumes:
      - ./data/gateway:/data
      - ./data/staging:/staging:ro
      - ./data/remote-cache:/remote-cache
      - ./data/local-status:/local-status:ro
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4844/api/health', timeout=3); urllib.request.urlopen('http://127.0.0.1:4844/api/cloud/auth/status', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
