plugin_load password_file /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/secrets/auth/passwords

plugin_load acl_file /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/proxy.acl

listener 1883 0.0.0.0
listener_allow_anonymous true

listener 8883 0.0.0.0
listener_allow_anonymous false
plugin_use password_file
plugin_use acl_file
cafile /mosquitto/secrets/certs/ca.crt
certfile /mosquitto/secrets/certs/server.crt
keyfile /mosquitto/secrets/certs/server.key
tls_version tlsv1.2
require_certificate false

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
sys_interval 10
