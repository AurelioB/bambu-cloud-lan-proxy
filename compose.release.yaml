  bootstrap:
    image: ${PROXY_BOOTSTRAP_IMAGE:?Missing release.env}
    build: !reset null
  mqtt:
    image: ${PROXY_MQTT_IMAGE:?Missing release.env}
    build: !reset null
  gateway:
    image: ${PROXY_IMAGE:?Missing release.env}
