  endpoint-manager:
    image: ${PROXY_IMAGE:?Missing release.env}
    build: !reset null
  endpoint-addresses:
    image: ${PROXY_IMAGE:?Missing release.env}
    build: !reset null
  ftps:
    image: ${PROXY_IMAGE:?Missing release.env}
    build: !reset null
  camera:
    image: ${PROXY_IMAGE:?Missing release.env}
    build: !reset null
  native-files:
    image: ${PROXY_IMAGE:?Missing release.env}
    build: !reset null
  discovery:
    image: ${PROXY_IMAGE:?Missing release.env}
    build: !reset null
  camera-ingress:
    image: ${PROXY_IMAGE:?Missing release.env}
    build: !reset null
  local-status:
    image: ${PROXY_IMAGE:?Missing release.env}
    build: !reset null
