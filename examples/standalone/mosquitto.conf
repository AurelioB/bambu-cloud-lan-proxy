# Dedicated Mosquitto 2.x instance; do not expose its anonymous listener.
per_listener_settings true
listener 1883 127.0.0.1
allow_anonymous true

listener 18883 127.0.0.1
allow_anonymous false
password_file /var/lib/bambu-proxy/tls/runtime/auth/passwords
acl_file /etc/bambu-proxy/proxy.acl
cafile /var/lib/bambu-proxy/tls/runtime/certs/ca.crt
certfile /var/lib/bambu-proxy/tls/runtime/certs/server.crt
keyfile /var/lib/bambu-proxy/tls/runtime/certs/server.key
tls_version tlsv1.2
require_certificate false
persistence false
log_dest stdout
