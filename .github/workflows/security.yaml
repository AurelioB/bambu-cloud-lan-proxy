name: Security checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Scan full Git history, not only the current diff
        run: |
          scanner=$(./scripts/audit-tool.sh gitleaks)
          "$scanner" git --log-opts=--all --config .gitleaks.toml --redact --no-banner .
      - name: Check workflow syntax
        run: |
          checker=$(./scripts/audit-tool.sh actionlint)
          "$checker" -shellcheck=""
      - name: Audit Rust lockfile against RustSec
        run: |
          auditor=$(./scripts/audit-tool.sh cargo-audit)
          "$auditor" audit --file Cargo.lock
      - run: npm --prefix web audit
      - run: npm --prefix website audit
