name: Prepare release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push versioned GHCR images and create a DRAFT release (owner approval)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
  documentation:
    uses: ./.github/workflows/docs.yaml
  security:
    uses: ./.github/workflows/security.yaml
  publish-draft:
    if: inputs.publish
    needs: [ci, documentation, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require reviewed main and an unpublished version
        run: |
          test "$GITHUB_REF" = refs/heads/main
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$'
          test -z "$(git ls-remote --tags origin "refs/tags/v$version")"
          printf 'RELEASE_VERSION=%s\nREGISTRY_IMAGE=ghcr.io/%s\n' "$version" "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release-artifacts
      - name: Verify candidate before registry writes
        run: |
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          jq -e --arg revision "$GITHUB_SHA" '.revision == $revision' release-artifacts/build.json
      - name: Build release images from the tested revision
        run: |
          docker build --platform linux/amd64 -f Dockerfile.proxy --build-arg PROXY_VERSION="$RELEASE_VERSION" --build-arg PROXY_REVISION="$GITHUB_SHA" -t "$REGISTRY_IMAGE:v$RELEASE_VERSION" .
          docker build --platform linux/amd64 -f docker/bootstrap.Dockerfile --build-arg PROXY_VERSION="$RELEASE_VERSION" --build-arg PROXY_REVISION="$GITHUB_SHA" -t "$REGISTRY_IMAGE-bootstrap:v$RELEASE_VERSION" .
          docker build --platform linux/amd64 -f docker/mqtt.Dockerfile --build-arg PROXY_VERSION="$RELEASE_VERSION" --build-arg PROXY_REVISION="$GITHUB_SHA" -t "$REGISTRY_IMAGE-mqtt:v$RELEASE_VERSION" .
      - name: Package the exact image that will be pushed
        run: |
          ./scripts/package-release.sh "$REGISTRY_IMAGE:v$RELEASE_VERSION" "$REGISTRY_IMAGE" published-artifacts
          ./tests/release-bundles.sh published-artifacts "$REGISTRY_IMAGE:v$RELEASE_VERSION"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY_IMAGE }}:v${{ env.RELEASE_VERSION }}
          output-file: published-artifacts/proxy.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY_IMAGE }}-bootstrap:v${{ env.RELEASE_VERSION }}
          output-file: published-artifacts/bootstrap.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY_IMAGE }}-mqtt:v${{ env.RELEASE_VERSION }}
          output-file: published-artifacts/mqtt.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Push explicit version tags only
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for suffix in '' -bootstrap -mqtt; do
            if docker manifest inspect "$REGISTRY_IMAGE$suffix:v$RELEASE_VERSION" >/dev/null 2>&1; then
              echo 'Refusing to overwrite an existing release image tag.' >&2
              exit 1
            fi
          done
          for suffix in '' -bootstrap -mqtt; do
            reference="$REGISTRY_IMAGE$suffix:v$RELEASE_VERSION"
            docker push "$reference"
            docker image inspect --format '{{index .RepoDigests 0}}' "$reference" >> published-artifacts/IMAGE_DIGESTS
          done
      - name: Create draft with checksums and SBOMs, never publish automatically
        run: |
          (cd published-artifacts && sha256sum ./*.tar.gz build.json ./*.spdx.json IMAGE_DIGESTS > SHA256SUMS)
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "v$RELEASE_VERSION — Community release" --notes-file "docs/release-notes-v$RELEASE_VERSION.md" published-artifacts/*
