name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo fmt --check
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:ui
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: web/test-results/
          retention-days: 7
      - run: cargo test --locked
      - run: cp .env.example .env
      - run: sed -i 's/PROXY_ACCESS_CODE=CHANGE_ME/PROXY_ACCESS_CODE=TEST1234/' .env
      - run: docker compose config --quiet
      - run: docker build -f Dockerfile.proxy --build-arg PROXY_VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1) --build-arg PROXY_REVISION="$GITHUB_SHA" -t bambu-cloud-lan-proxy:test .
      - run: docker run --rm --network none bambu-cloud-lan-proxy:test --version
      - name: Validate release bundles
        run: |
          ./scripts/package-release.sh bambu-cloud-lan-proxy:test "ghcr.io/${GITHUB_REPOSITORY,,}" release-artifacts
          ./tests/release-bundles.sh release-artifacts bambu-cloud-lan-proxy:test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: release-artifacts/
          retention-days: 14
