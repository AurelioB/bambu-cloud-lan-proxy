[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-cloud-lan-proxy"
version = "0.4.0"
description = "A local Bambu-shaped MQTT facade backed by Bambu Gateway cloud sessions"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AurelioB"}]
dependencies = ["paho-mqtt==2.1.0"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
